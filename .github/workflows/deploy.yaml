name: auto-deploy

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 安装 Node.js（node 16 用 OpenSSL 1.1，不需要 legacy-provider）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      # 安装依赖
      - name: Install
        run: npm install

      # 构建
      - name: Build
        run: npm run build

      # 部署到 GitHub Pages
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: ./dist
          branch: gh-pages
          clean: true
